  <head>
    <meta charset="UTF-8" />

    <title>Hariprasad Mukkera | Java Full Stack Developer</title>

    />

    <!-- Open Graph: how the site previews when shared on LinkedIn / WhatsApp -->
    <meta property="og:title" content="Hariprasad Mukkera | Java Full Stack Developer" />

      property="og:description"
      content="Java Full Stack Developer skilled in Spring Boot, React.js, MySQL and Docker. View my projects and resume."

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme BEFORE React loads so there is no flash -->
    <script>
      (function () {
        try {
          var override = new URLSearchParams(window.location.search).get('theme');
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = override ? override === 'dark' : saved ? saved === 'dark' : prefersDark;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
